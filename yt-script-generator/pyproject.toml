[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-script-generator"
version = "0.1.0"
description = "A monetization-safe, copyright-safe, audience-attracting AI YouTube script generator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aman", email = "aman@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.2",
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0"
]

[project.scripts]
ytscript = "ytscript.main:app"

[tool.setuptools.packages.find]
where = ["src"]
