<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Enhancer</title>
  <link rel="stylesheet" href="style.css" />
  <!-- WaveSurfer.js CDN -->
  <script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>
  <div class="container glass-container">
    <h1>Studio‑Quality Voice Enhancer</h1>

    <!-- Upload Section -->
    <div id="upload-section" class="upload-section">
      <div id="drop-area" class="drop-area">
        <p>Drag &amp; drop an audio file here, or click to select</p>
        <input type="file" id="file-input" accept="audio/*" style="display:none;" />
      </div>
      <button id="select-btn" class="btn primary-btn" type="button">Select Audio File</button>
      <div id="status" class="status"></div>
    </div>

    <!-- Processing Section -->
    <div id="processing-section" class="processing-section hidden">
      <div class="spinner"></div>
      <p>Processing your audio, please wait...</p>
    </div>

    <!-- Result Section -->
    <div id="result-section" class="result-section hidden">
      <div id="waveform" class="waveform-box"></div>
      <div class="toggle-container">
        <span class="label">Original</span>
        <label class="switch">
          <input type="checkbox" id="compare-toggle" />
          <span class="slider round"></span>
        </label>
        <span class="label active-label">Enhanced</span>
      </div>
      <div class="action-buttons">
        <button id="play-pause-btn" class="btn primary-btn">▶ Play</button>
        <a id="download-btn" class="btn success-btn" href="#" download="enhanced.wav" hidden>Download Enhanced Audio</a>
        <button id="reset-btn" class="btn secondary-btn">Reset</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
